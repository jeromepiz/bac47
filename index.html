/* ============================================================
   Le Mystère du Bac 47 — même univers que L'Affaire de la Benne 3
   Mise en page : bandeau d'avancement + scène 4/3 + dossier manille
   Motifs : hachures jaune/noir, plaque de benne, chemise manille, liège
   ============================================================ */
:root{
  color-scheme: dark;
  --bitume:#10161B; --acier:#1C2831; --acier-2:#2C3C48; --acier-3:#41566A;
  --jaune:#FFC81E; --jaune-ink:#1A1400;
  --manille:#E8DBB9; --manille-2:#D3C49A; --feuille:#FFFCF2; --encre:#172028; --muted:#5C5543;
  --rouge:#B93A22; --vert:#2A6A45; --bleu:#2F5F86;
  --text:#E9EEF1; --text-dim:#9DB0BE;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Kalam","Comic Sans MS",cursive;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bitume);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font-family:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--jaune);outline-offset:2px}

.app{height:100%;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:10px 12px;padding-inline:16px}

/* En-tête */
.hud{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"rail rail" "chap tools";gap:8px 10px;align-items:end}
.rail{grid-area:rail;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;height:7px;margin:0;padding:0;list-style:none}
.rail li{background:var(--acier-2);border-radius:2px}
.rail li.done{background:var(--jaune)}
.rail li.now{background:repeating-linear-gradient(-45deg,var(--jaune) 0 5px,#171100 5px 10px)}
.chap{grid-area:chap;min-width:0}
.chap span{display:block;font-size:13px;color:var(--text-dim);line-height:1.2}
.chap strong{display:block;font-family:var(--display);font-weight:800;font-size:26px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{grid-area:tools;display:flex;gap:10px;align-items:center}
.stat{display:flex;align-items:center;gap:4px;font-family:var(--display);font-weight:700;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.stat svg{width:19px;height:19px}
.hud-btn{font-family:var(--display);font-weight:700;font-size:19px;line-height:1;background:transparent;color:var(--jaune);border:2px solid var(--jaune);border-radius:8px;padding:7px 11px 6px;cursor:pointer;min-height:38px}
.hud-btn:active{background:rgba(255,200,30,.16)}
.hud-btn.snd{width:38px;padding:0;display:grid;place-items:center}
.hud-btn.snd svg{width:19px;height:19px}
.hud-btn.snd[aria-pressed="false"]{color:var(--text-dim);border-color:var(--acier-3)}

/* Scène */
.stage{position:relative;flex:none;width:100%;max-width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#0B1014;box-shadow:0 0 0 2px var(--acier-2);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage.hunt{cursor:crosshair}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.pop{animation:pop .4s ease-out both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.fade{animation:fade 1.6s ease-out forwards}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
.title-ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:10px;padding:16px 16px 18px;
  background:linear-gradient(to top,rgba(8,12,15,.94) 0%,rgba(8,12,15,.55) 48%,rgba(8,12,15,0) 80%)}
.plate{margin:0;display:flex;flex-direction:column;padding:10px 26px 12px;color:var(--jaune-ink);font-family:var(--display);
  border:3px solid #1A1400;border-radius:6px;transform:rotate(-1.2deg);transform-origin:left bottom;
  background:radial-gradient(circle at 10px 10px,#1A1400 0 3px,transparent 3.5px),radial-gradient(circle at calc(100% - 10px) 10px,#1A1400 0 3px,transparent 3.5px),radial-gradient(circle at 10px calc(100% - 10px),#1A1400 0 3px,transparent 3.5px),radial-gradient(circle at calc(100% - 10px) calc(100% - 10px),#1A1400 0 3px,transparent 3.5px),var(--jaune);
  box-shadow:0 0 0 3px var(--jaune),0 10px 22px rgba(0,0,0,.45);animation:plate-in .6s cubic-bezier(.2,.9,.3,1.2) both}
.pl-s{font-weight:700;font-size:clamp(20px,6vw,26px);line-height:1}
.pl-b{font-weight:800;font-size:clamp(54px,17vw,84px);line-height:.86;text-transform:uppercase}
.byline{margin:0;font-size:16px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
@keyframes plate-in{from{transform:translateY(-18px) rotate(-5deg);opacity:0}to{transform:rotate(-1.2deg);opacity:1}}
.toast{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(16,22,27,.95);color:var(--text);border-left:4px solid var(--jaune);border-radius:6px;padding:8px 12px;font-size:15px;transform:translateY(16px);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast.bad{border-left-color:#E0703A}

/* Dossier */
.panel{flex:1 1 auto;min-height:200px;background:var(--manille);color:var(--encre);border-radius:12px;padding:16px 18px 18px;overflow:auto;scrollbar-width:thin}
.panel h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;margin:0;text-wrap:balance}
.panel p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px;min-height:100%}
.kicker{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);line-height:1.1}
.who{display:flex;align-items:center;gap:12px}
.pf{width:72px;height:72px;border-radius:8px;overflow:hidden;flex:none;border:3px solid var(--encre);background:var(--manille-2);box-shadow:0 4px 0 var(--encre)}
.pf svg,.pf img{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 22%}
.tag{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.05;background:var(--encre);color:var(--jaune);padding:4px 12px;border-radius:4px}
.line{font-size:19px;line-height:1.5;min-height:3em}
.narr .line{font-style:italic;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.btn{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.1;background:var(--encre);color:var(--jaune);border:0;border-radius:8px;padding:11px 16px;cursor:pointer;box-shadow:0 4px 0 #000;text-align:left}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #000}
.btn.ghost{background:transparent;color:var(--encre);box-shadow:inset 0 0 0 2px var(--encre)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.next{margin-left:auto}
.choice{display:block;width:100%;text-align:left;font-family:var(--body);font-size:17px;line-height:1.35;background:var(--feuille);color:var(--encre);border:2px solid var(--encre);border-radius:8px;padding:10px 12px;cursor:pointer}
.choice.ok{background:#CFE7D6;border-color:var(--vert)}
.choice.ko{background:#F2D0C6;border-color:var(--rouge);text-decoration:line-through}
.choice[disabled]{cursor:default}
.list{display:flex;flex-direction:column;gap:8px}
.note{font-family:var(--hand);font-size:18px;line-height:1.3;background:#FFF3A6;color:var(--encre);padding:8px 12px;border-radius:2px;box-shadow:0 3px 0 rgba(0,0,0,.18);transform:rotate(-.6deg)}
.found{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;font-size:15px}
.found li{background:var(--feuille);border-left:4px solid var(--vert);padding:6px 10px;border-radius:4px}
.meter{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700}
.field input{font:inherit;font-weight:400;font-size:18px;padding:10px 12px;border:2px solid var(--encre);border-radius:8px;background:var(--feuille);color:var(--encre)}
.seg{display:flex;gap:8px}
.seg button{flex:1;font-family:var(--display);font-weight:700;font-size:20px;padding:8px;border:2px solid var(--encre);border-radius:8px;background:transparent;color:var(--encre);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--encre);color:var(--jaune)}
.slots{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;counter-reset:s}
.slots li{counter-increment:s;display:flex;gap:8px;align-items:stretch}
.slots li::before{content:counter(s);font-family:var(--display);font-weight:800;font-size:20px;width:28px;flex:none;display:grid;place-items:center;background:var(--encre);color:var(--jaune);border-radius:6px}
.slot{flex:1;min-width:0;min-height:44px;border:2px dashed var(--muted);border-radius:8px;padding:6px 10px;font-size:15px;line-height:1.3;background:transparent;color:var(--encre);text-align:left;cursor:pointer}
.slot.full{border-style:solid;border-color:var(--encre);background:var(--feuille)}
.slot.ok{border-color:var(--vert);background:#CFE7D6}
.slot time{font-family:var(--display);font-weight:800;font-size:17px;margin-right:6px}
.cards{display:flex;flex-direction:column;gap:6px}
.card{font-size:15px;line-height:1.3;text-align:left;padding:8px 10px;border-radius:8px;border:2px solid var(--encre);background:var(--feuille);color:var(--encre);cursor:pointer}
.card[aria-pressed="true"]{background:var(--encre);color:var(--jaune)}
.card.used{display:none}
.rank{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--encre)}
.rules{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.rules li::marker{font-family:var(--display);font-weight:800}
  .credits{font-size:13px;color:var(--muted);line-height:1.4}
details{background:var(--feuille);border-radius:8px;padding:8px 12px}
summary{font-family:var(--display);font-weight:800;font-size:20px;cursor:pointer}
details ul{margin:8px 0 2px;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}

/* Carnet */
.sheet{position:fixed;inset:0;background:rgba(5,8,10,.7);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:5}
.sheet-in{width:100%;max-width:588px;max-height:80%;overflow:auto;background:var(--manille);color:var(--encre);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.piece{background:var(--feuille);border-radius:6px;padding:8px 12px;border-left:4px solid var(--jaune)}
.piece b{font-family:var(--display);font-size:19px;display:block}
.piece span{font-size:15px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var panel = $('panel'), stage = $('stage'), rue = $('sv-rue'), board = $('sv-board'), marks = $('marks');
  var NS = 'http://www.w3.org/2000/svg';

  /* ---------- Son ---------- */
  var SND = {on:true, ctx:null};
  try { SND.on = localStorage.getItem('b47-son') !== 'off'; } catch(e){}
  function actx(){
    if (!SND.ctx){ var C = window.AudioContext || window.webkitAudioContext; if (!C) return null; try { SND.ctx = new C(); } catch(e){ return null; } }
    if (SND.ctx.state === 'suspended') SND.ctx.resume();
    return SND.ctx;
  }
  function tone(f, dt, dur, type, vol, glide){
    if (!SND.on || !SND.ctx) return; var c = SND.ctx, t0 = c.currentTime + 0.02 + dt;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
    if (glide) o.frequency.exponentialRampToValueAtTime(glide, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function sfxFound(){ tone(659,0,.25,'triangle',.16); tone(988,.09,.4,'triangle',.14); }
  function sfxMiss(){ tone(170,0,.2,'square',.045,110); }
  function sfxWin(){ [523,659,784].forEach(function(f,i){ tone(f,i*.12,.2,'triangle',.14); }); tone(1047,.36,.7,'triangle',.15); }
  function sfxCoo(){
    if (!SND.on || !SND.ctx) return; var c = SND.ctx, t = c.currentTime + 0.02;
    [[0,340,265],[0.42,300,225]].forEach(function(n){
      var o = c.createOscillator(), m = c.createGain(), e = c.createGain(), lfo = c.createOscillator(), lg = c.createGain(), lp = c.createBiquadFilter();
      o.type = 'sine'; o.frequency.setValueAtTime(n[1], t+n[0]); o.frequency.exponentialRampToValueAtTime(n[2], t+n[0]+0.34);
      lfo.frequency.value = 26; lg.gain.value = 0.5; m.gain.value = 0.5; lfo.connect(lg); lg.connect(m.gain);
      lp.type = 'lowpass'; lp.frequency.value = 900;
      e.gain.setValueAtTime(0.0001, t+n[0]); e.gain.exponentialRampToValueAtTime(0.22, t+n[0]+0.06); e.gain.exponentialRampToValueAtTime(0.0001, t+n[0]+0.38);
      o.connect(m); m.connect(lp); lp.connect(e); e.connect(c.destination);
      o.start(t+n[0]); lfo.start(t+n[0]); o.stop(t+n[0]+0.4); lfo.stop(t+n[0]+0.4);
    });
  }
  /* Voix : identifiant de réplique -> fichier MP3 (variante _f pour « Inspectrice ») */
  var VOICES = {}; ['c1_01','c1_02','c2_01','c2_02','c2_03','c2_04','c2_05','c2_06','c2_07','c2_08','c2_08_f','c2_09','c2_10','c3_01','c4_01','c4_02','c5_01','f_01','f_01_f','f_02','p_01','p_01_f','p_02','p_03','p_04','p_05','p_05_f'].forEach(function(k){ VOICES[k] = k + '.mp3'; });
  var voice = null;
  function stopVoice(){ if (voice){ try { voice.pause(); } catch(e){} voice = null; } }
  function playVoice(id){
    stopVoice(); if (!id || !SND.on) return;
    var key = (S.titre === 'Inspectrice' && VOICES[id+'_f']) ? id+'_f' : id;
    if (!VOICES[key]) return;
    try { voice = new Audio(VOICES[key]); var p = voice.play(); if (p && p.catch) p.catch(function(){}); } catch(e){}
  }
  function sfxPiece(){ tone(880,0,.12,'square',.05); tone(1320,.1,.2,'square',.05); }
  var ICON_ON = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5 H6.5 L11 3.5 V16.5 L6.5 12.5 H3Z" fill="currentColor"/><path d="M13.5 7 Q15.5 10 13.5 13 M15.5 5 Q19 10 15.5 15" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>';
  var ICON_OFF = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5 H6.5 L11 3.5 V16.5 L6.5 12.5 H3Z" fill="currentColor"/><path d="M13.5 7.5 L18 12.5 M18 7.5 L13.5 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
  function paintSound(){ var b = $('btn-sound'); b.innerHTML = SND.on ? ICON_ON : ICON_OFF; b.setAttribute('aria-pressed', String(SND.on)); b.setAttribute('aria-label', SND.on ? 'Son activé' : 'Son coupé'); }
  $('btn-sound').onclick = function(){ SND.on = !SND.on; if (!SND.on) stopVoice(); try { localStorage.setItem('b47-son', SND.on ? 'on' : 'off'); } catch(e){} actx(); paintSound(); };
  paintSound();

  /* ---------- Liège du tableau ---------- */
  (function(){ var g = $('liege'), seed = 7; function r(){ seed = (seed*9301+49297)%233280; return seed/233280; }
    for (var i=0;i<420;i++){ var c = document.createElementNS(NS,'circle'); c.setAttribute('cx', r()*1200); c.setAttribute('cy', r()*900); c.setAttribute('r', 2+r()*5); g.appendChild(c); } })();

  /* ---------- Portraits ---------- */
  var PF = {};
  ['vigie:hortense','pipo:pipo','dylan:dylan','nanard:nanard','sylvie:sylvie','pinchon:pinchon'].forEach(function(p){
    var k = p.split(':'); PF[k[0]] = '<img src="perso_'+k[1]+'.jpg" alt="" width="72" height="72">';
  });
  var NAMES = {vigie:'Commissaire Vigie', pipo:'Pipo', dylan:'Dylan', nanard:'Nanard', sylvie:'Sylvie', pinchon:'M. Pinchon'};

  /* ---------- État ---------- */
  var S;
  /* Adresse du script Google Sheets (Apps Script, « Application Web »). Vide = aucun envoi. */
  var SHEET_URL = 'https://script.google.com/macros/s/AKfycby-9C_7NPSFFzMiftBMwl3wJ0TFxrp22slu_JnXgo8a6geeqGKN6q5JTjvsYBoTsEh_/exec';
  function reset(){ S = {name:'', agence:'', titre:'Inspecteur', pts:0, chap:0, pieces:[], found:[], score:{}, cp:[], t0:0, sent:false}; }
  reset();
  function fill(t){ var full = S.name ? S.titre + ' ' + S.name : S.titre; return t.split('{Insp}').join(full).split('{insp}').join(S.titre.toLowerCase()); }
  function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function addPts(n){ S.pts = Math.max(0, S.pts + n); $('hud-pts').textContent = S.pts; }
  var toastT;
  function toast(msg, bad){ var t = $('toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : ''); clearTimeout(toastT); toastT = setTimeout(function(){ t.className = 'toast' + (bad ? ' bad' : ''); }, 2600); }

  var CHAPS = ['La photo','Les témoins','La chronologie','Les causes','Les bons réflexes'];
  function setChap(n){
    S.chap = n; if (n) S.cp[n] = S.pts;
    $('chap-n').textContent = n ? 'Chapitre ' + n : 'Prologue';
    $('chap-t').textContent = n ? CHAPS[n-1] : 'Impasse des Tilleuls';
    var lis = $('rail').children;
    for (var i=0;i<5;i++) lis[i].className = (i < n-1) ? 'done' : (i === n-1 ? 'now' : '');
  }
  function scene(name){
    var showRue = name === 'rue' || name === 'titre' || name === 'chasse';
    rue.toggleAttribute('hidden', !showRue); board.toggleAttribute('hidden', name !== 'board');
    $('title-ov').hidden = name !== 'titre';
    stage.classList.toggle('hunt', name === 'chasse');
  }

  /* ---------- Pièces du carnet ---------- */
  var PIECES = {
    photo:{t:'Photo de M. Pinchon', d:"Prise à 5h41 depuis sa fenêtre. Feux de recul allumés, Nanard sur le marchepied, Dylan sans gilet ni gants."},
    decl:{t:'Déclaration de Dylan', d:"« J'ai voulu le retenir. Réflexe. On m'avait jamais montré l'arrêt d'urgence. »"},
    gps:{t:'Trace GPS de la benne', d:"5h39 : 60 mètres en marche arrière dans l'impasse des Tilleuls."},
    pesee:{t:'Ticket de pesée embarquée', d:"Bac 47, 240 litres : 118 kg. Un bac de cette taille est prévu pour environ 96 kg."},
    route:{t:'Feuille de route', d:"Départ prévu 5h05, départ réel 5h25. Motif : plein de GNV non fait la veille."}
  };
  function addPiece(k){
    if (S.pieces.indexOf(k) >= 0) return;
    S.pieces.push(k); sfxPiece(); toast('Nouvelle pièce au carnet : ' + PIECES[k].t);
    var g = $('pin-' + k); if (g){ g.setAttribute('opacity','1'); g.classList.add('pop'); g.addEventListener('animationend', function(){ g.classList.remove('pop'); }, {once:true}); }
    if (S.pieces.length >= 2) $('strings').setAttribute('opacity','.85');
  }

    Q.o.forEach(function(o, i){ h += '<button class="choice" type="button" data-i="'+i+'">'+esc(o)+'</button>'; });
    h += '</div><p class="note" id="expl" hidden></p><div class="row" id="qrow"></div></div>';
    panel.innerHTML = h; panel.scrollTop = 0;
    Array.prototype.forEach.call(panel.querySelectorAll('.choice'), function(b){
      b.onclick = function(){
        var i = +b.getAttribute('data-i');
        Array.prototype.forEach.call(panel.querySelectorAll('.choice'), function(x){ x.disabled = true; if (+x.getAttribute('data-i') === Q.ok) x.classList.add('ok'); });
        if (i === Q.ok){ addPts(5); sfxFound(); } else { b.classList.add('ko'); sfxMiss(); }
        var e = $('expl'); e.textContent = Q.e; e.hidden = false;
        $('qrow').innerHTML = '<button class="btn next" type="button" id="nx">'+(k+1 < QUIZ.length ? 'Situation suivante ▸' : 'Clore l\'affaire ▸')+'</button>';
        $('nx').onclick = function(){ k+1 < QUIZ.length ? quiz(k+1) : finale(); };
        $('nx').focus({preventScroll:true});
      };
    });
  }

  /* ---------- Fin ---------- */
  function finale(){
    run([
      {scene:'board'},
      {id:'f_01', who:'vigie', text:"Affaire classée, {Insp}. Dylan reprend lundi, avec des gants, un gilet et une vraie démonstration de l'arrêt d'urgence."},
      {id:'f_02', who:'pinchon', text:"Et moi, j'ai loué une benne à gravats. Elle est garée devant chez le boulanger."},
      {who:'pipo', text:"Rrrou."}
    ], showEnd);
  }
  function rankFor(p){ return p >= 105 ? 'Commissaire de tournée' : p >= 80 ? 'Chef d\'équipe' : p >= 50 ? 'Ripeur confirmé' : 'Ripeur stagiaire'; }
  function sendResult(){
    if (S.sent) return; S.sent = true;
    var ch = [], i;
    for (i=1;i<=5;i++) ch.push((i<5 ? S.cp[i+1] : S.pts) - S.cp[i]);
    var data = {nom:S.name, titre:S.titre, agence:S.agence, score:S.pts, grade:rankFor(S.pts),
      duree_min:Math.round((Date.now()-S.t0)/600)/100, ch1:ch[0], ch2:ch[1], ch3:ch[2], ch4:ch[3], ch5:ch[4]};
    var st = $('send-st'); if (!st) return;
    if (!SHEET_URL){ st.textContent = 'Résultat non enregistré : le tableau de suivi n\'est pas encore configuré.'; return; }
    try {
      fetch(SHEET_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(data)})
        .then(function(){ st.textContent = 'Résultat envoyé au tableau de suivi.'; })
        .catch(function(){ st.textContent = 'Envoi impossible (pas de connexion ?). Le résultat n\'a pas été enregistré.'; });
    } catch(e){ st.textContent = 'Envoi impossible. Le résultat n\'a pas été enregistré.'; }
  }
  function showEnd(){
    var lis = $('rail').children; for (var i=0;i<5;i++) lis[i].className = 'done';
    $('chap-n').textContent = 'Affaire classée'; $('chap-t').textContent = 'Le bac 47';
    panel.innerHTML = '<div class="stack">'+
      '<p class="kicker">'+esc(fill('{Insp}'))+(S.agence ? ' · '+esc(S.agence) : '')+' · '+S.pts+' points Vigilance sur 120</p>'+
      '<p class="rank">'+rankFor(S.pts)+'</p>'+
      '<h2>Ce qu\'on retient</h2><ol class="rules">'+
      '<li>On ne touche jamais un bac pendant la levée. En cas de problème : arrêt d\'urgence, et on s\'écarte.</li>'+
      '<li>Jamais sur le marchepied en marche arrière. Un guide à pied, visible dans le rétroviseur.</li>'+
      '<li>Bac surchargé ou abîmé : on ne le collecte pas, on le signale.</li>'+
      '<li>Le retard ne se rattrape pas sur la sécurité. On prévient le chef d\'équipe.</li>'+
      '<li>La vérification de départ se fait en équipe, chaque jour, en entier.</li></ol>'+
      '<details><summary>Pour l\'animateur : questions de débrief</summary><ul>'+
      '<li>Chez nous, où sont les arrêts d\'urgence sur chaque benne ? Qui les a déjà testés ?</li>'+
      '<li>Dans quelles rues de nos tournées doit-on reculer ? Comment on s\'organise ?</li>'+
      '<li>Que fait-on concrètement d\'un bac surchargé : étiquette, photo, remontée ?</li>'+
      '<li>Quand on est en retard, qui prévient qui ?</li>'+
      '<li>Un nouveau arrive lundi : qu\'est-ce qu\'on lui montre le premier jour ?</li></ul></details>'+
      '<p class="credits" id="send-st">Envoi du résultat…</p>'+
      '<p class="credits">Illustrations générées avec Gemini · Voix générées avec ElevenLabs (elevenlabs.io) · Portraits de la Commissaire Vigie et de Pipo repris de L\'Affaire de la Benne 3.</p>'+
      '<div class="row"><button class="btn ghost" type="button" id="carn">Revoir le carnet</button><button class="btn next" type="button" id="again">Rejouer ▸</button></div></div>';
    $('carn').onclick = openCarnet; $('again').onclick = showTitle;
    sendResult();
  }

  showTitle();
})();
</script>
